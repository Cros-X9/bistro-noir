<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-label="Illustration of the restaurant interior with tables and chairs">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f1f1f"/>
      <stop offset="1" stop-color="#2a2622"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b241c"/>
      <stop offset="1" stop-color="#1a1611"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="1">
      <stop offset="0" stop-color="#f5d594" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f5d594" stop-opacity="0"/>
    </radialGradient>
    <g id="chair">
      <rect x="-16" y="-34" width="32" height="30" rx="5" fill="#6b4a2b"/>
      <rect x="-18" y="-6" width="36" height="9" rx="3" fill="#8a6038"/>
      <rect x="-15" y="3" width="4" height="22" fill="#4a3320"/>
      <rect x="11" y="3" width="4" height="22" fill="#4a3320"/>
    </g>
    <g id="table">
      <ellipse cx="0" cy="0" rx="62" ry="14" fill="#d6b47a"/>
      <ellipse cx="0" cy="-3" rx="62" ry="14" fill="#e6c78f"/>
      <rect x="-5" y="8" width="10" height="46" fill="#4a3320"/>
      <ellipse cx="0" cy="56" rx="26" ry="6" fill="#33241a"/>
      <!-- candle -->
      <rect x="-3" y="-20" width="6" height="14" fill="#f3ead8"/>
      <ellipse cx="0" cy="-24" rx="3" ry="5" fill="#ffb347"/>
    </g>
  </defs>

  <!-- wall and floor -->
  <rect width="800" height="420" fill="url(#wall)"/>
  <rect y="250" width="800" height="170" fill="url(#floor)"/>
  <rect y="248" width="800" height="4" fill="#d6b47a" opacity="0.5"/>

  <!-- window -->
  <rect x="330" y="60" width="140" height="120" rx="6" fill="#0f1620" stroke="#d6b47a" stroke-width="3"/>
  <path d="M400 60 V180 M330 120 H470" stroke="#d6b47a" stroke-width="2"/>
  <circle cx="440" cy="90" r="8" fill="#f3ead8" opacity="0.8"/>

  <!-- pendant lamps -->
  <g>
    <line x1="150" y1="0" x2="150" y2="70" stroke="#d6b47a" stroke-width="2"/>
    <path d="M125 100 Q150 60 175 100 Z" fill="#d6b47a"/>
    <ellipse cx="150" cy="170" rx="110" ry="130" fill="url(#glow)"/>

    <line x1="650" y1="0" x2="650" y2="70" stroke="#d6b47a" stroke-width="2"/>
    <path d="M625 100 Q650 60 675 100 Z" fill="#d6b47a"/>
    <ellipse cx="650" cy="170" rx="110" ry="130" fill="url(#glow)"/>

    <line x1="400" y1="0" x2="400" y2="30" stroke="#d6b47a" stroke-width="2"/>
    <path d="M378 56 Q400 22 422 56 Z" fill="#d6b47a"/>
  </g>

  <!-- left table with two chairs -->
  <use href="#chair" x="95" y="320"/>
  <use href="#chair" x="205" y="320"/>
  <use href="#table" x="150" y="305"/>

  <!-- center table -->
  <use href="#chair" x="345" y="345"/>
  <use href="#chair" x="455" y="345"/>
  <use href="#table" x="400" y="330"/>

  <!-- right table with two chairs -->
  <use href="#chair" x="595" y="320"/>
  <use href="#chair" x="705" y="320"/>
  <use href="#table" x="650" y="305"/>

  <!-- plants -->
  <g>
    <rect x="30" y="215" width="26" height="36" rx="3" fill="#4a3320"/>
    <path d="M43 215 Q20 180 36 150 Q44 180 43 215 Z" fill="#3f7a4a"/>
    <path d="M43 215 Q66 175 52 145 Q40 180 43 215 Z" fill="#4f9a5c"/>
    <rect x="744" y="215" width="26" height="36" rx="3" fill="#4a3320"/>
    <path d="M757 215 Q734 180 750 150 Q758 180 757 215 Z" fill="#3f7a4a"/>
    <path d="M757 215 Q780 175 766 145 Q754 180 757 215 Z" fill="#4f9a5c"/>
  </g>
</svg>
