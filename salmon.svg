<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Grilled salmon illustration">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.4" r="0.8">
      <stop offset="0" stop-color="#2c3340"/>
      <stop offset="1" stop-color="#11141a"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- plate -->
  <ellipse cx="200" cy="248" rx="155" ry="30" fill="#000" opacity="0.35"/>
  <ellipse cx="200" cy="215" rx="155" ry="52" fill="#f4f1ea"/>
  <ellipse cx="200" cy="210" rx="118" ry="38" fill="#e8e3d8"/>
  <!-- asparagus -->
  <g stroke="#4a9a52" stroke-width="7" stroke-linecap="round">
    <path d="M95 200 L160 178"/>
    <path d="M100 215 L165 192"/>
    <path d="M108 188 L168 168"/>
  </g>
  <g fill="#2f7a3a">
    <circle cx="95" cy="200" r="5"/><circle cx="100" cy="215" r="5"/><circle cx="108" cy="188" r="5"/>
  </g>
  <!-- salmon fillet -->
  <rect x="150" y="150" width="170" height="68" rx="30" fill="#f0875a"/>
  <rect x="158" y="156" width="154" height="30" rx="14" fill="#f7a67d"/>
  <g stroke="#fbc9ad" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <path d="M180 162 Q200 172 220 162"/>
    <path d="M215 166 Q235 176 255 166"/>
    <path d="M250 162 Q268 170 285 162"/>
  </g>
  <!-- grill marks -->
  <g stroke="#7a3a1e" stroke-width="5" stroke-linecap="round" opacity="0.7">
    <path d="M185 175 L205 205"/>
    <path d="M215 172 L235 204"/>
    <path d="M245 172 L265 204"/>
    <path d="M275 175 L292 200"/>
  </g>
  <!-- lemon -->
  <circle cx="312" cy="195" r="26" fill="#f2d94a"/>
  <circle cx="312" cy="195" r="21" fill="#fbef9a"/>
  <g stroke="#f2d94a" stroke-width="2">
    <path d="M312 174 V216"/><path d="M291 195 H333"/>
    <path d="M297 180 L327 210"/><path d="M327 180 L297 210"/>
  </g>
  <!-- broccoli -->
  <g fill="#3f8f4a">
    <circle cx="140" cy="230" r="13"/><circle cx="154" cy="224" r="11"/><circle cx="128" cy="222" r="10"/>
  </g>
  <rect x="136" y="232" width="8" height="10" fill="#6aa86f"/>
  <!-- dill -->
  <g stroke="#4fa85a" stroke-width="2" stroke-linecap="round">
    <path d="M230 150 L238 138"/><path d="M236 150 L248 142"/><path d="M242 152 L254 150"/>
  </g>
